# ============================================================
#  tmux 配置 · Monokai · 插件由 TPM 管理
#  前缀键保持 Ctrl+b；prefix + I 安装插件，prefix + r 重载
# ============================================================

# ---------- 基础 ----------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g history-limit 100000
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
# 扩展按键：让 Shift+Enter、Ctrl+Shift 组合键透传给 Claude Code / nvim
set -g extended-keys on
set -as terminal-features ",xterm-ghostty:extkeys,xterm-256color:extkeys"
# undercurl 与彩色下划线（nvim 的诊断波浪线）
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g status-keys emacs
setw -g mode-keys vi
setw -g aggressive-resize on
set -g display-time 1500
set -g set-titles on
set -g set-titles-string "#S · #W"
# 关掉会话的最后一个窗口时切到其他会话，而不是退出 tmux
set -g detach-on-destroy off

# ---------- 快捷键 ----------
bind r source-file ~/.tmux.conf \; display-message " 配置已重载"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# prefix + h/j/k/l：切换面板（-r 允许连按）
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
bind x kill-pane
bind X confirm-before -p "关闭整个窗口? (y/n)" kill-window

# Alt 键免前缀：切换面板 / 窗口（Ghostty 已开启 option-as-alt）
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-n new-window -c "#{pane_current_path}"
# 上/下一个窗口：Alt+Shift+, 和 Alt+Shift+.（Alt+. 留给 zsh 插入上条命令的末参数）
bind -n 'M-<' previous-window
bind -n 'M->' next-window
bind -n M-z resize-pane -Z
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# 复制模式（vi 键位）
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# 弹窗工具
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind b display-popup -E -w 90% -h 90% "btop"
bind e display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "yazi"
# sesh：模糊搜索并跳转会话（含 zoxide 常用目录）
bind o display-popup -E -w 60% -h 60% -b rounded -S "fg=#75715E" \
  "sesh connect \"\$(sesh list -i | fzf --ansi --reverse --no-border --prompt '  会话 ❯ ' --pointer '▶')\""

# ---------- Monokai 外观 ----------
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#272822,fg=#F8F8F2"
set -g status-left-length 60
set -g status-right-length 120

set -g status-left "#[fg=#F92672,bg=#272822]#[fg=#272822,bg=#F92672,bold] #S #[fg=#F92672,bg=#272822]#[default] "
set -g status-right "#{?client_prefix,#[fg=#FD971F#,bg=#272822]#[fg=#272822#,bg=#FD971F#,bold] PREFIX #[fg=#FD971F#,bg=#272822]#[default] ,}#{?window_zoomed_flag,#[fg=#AE81FF#,bg=#272822]#[fg=#272822#,bg=#AE81FF#,bold] ZOOM #[fg=#AE81FF#,bg=#272822]#[default] ,}#[fg=#75715E] #{b:pane_current_path}  #[fg=#66D9EF,bg=#272822]#[fg=#272822,bg=#66D9EF,bold] %m-%d #[fg=#A6E22E,bg=#66D9EF]#[fg=#272822,bg=#A6E22E,bold]  %H:%M #[fg=#A6E22E,bg=#272822]"

setw -g window-status-separator ""
# Claude 状态符号：● 运行中  ◆ 等你处理  ✓ 已完成（由 ~/.claude/settings.json 的 hooks 写入窗口选项 @claude）
set -g @claude_badge "#{?#{==:#{@claude},run}, #[fg=#66D9EF]●,}#{?#{==:#{@claude},wait}, #[fg=#FD971F]◆,}#{?#{==:#{@claude},done}, #[fg=#A6E22E]✓,}"
set -g @claude_badge_current "#{?#{==:#{@claude},run}, ●,}#{?#{==:#{@claude},wait}, ◆,}#{?#{==:#{@claude},done}, ✓,}"
setw -g window-status-format "#[fg=#75715E] #I #[fg=#A6A69C]#W#{E:@claude_badge} "
setw -g window-status-current-format "#[fg=#E6DB74,bg=#272822]#[fg=#272822,bg=#E6DB74,bold]#I  #W#{?window_zoomed_flag, *,}#{E:@claude_badge_current}#[fg=#E6DB74,bg=#272822]"
setw -g window-status-activity-style "fg=#F92672"
setw -g monitor-activity on
set -g visual-activity off

set -g pane-border-style "fg=#49483E"
set -g pane-active-border-style "fg=#F92672"
set -g pane-border-lines heavy
set -g pane-border-status off
set -g message-style "bg=#49483E,fg=#E6DB74,bold"
set -g message-command-style "bg=#49483E,fg=#66D9EF"
set -g mode-style "bg=#49483E,fg=#F8F8F2"
set -g popup-border-style "fg=#75715E"
set -g display-panes-active-colour "#F92672"
set -g display-panes-colour "#66D9EF"
setw -g clock-mode-colour "#A6E22E"

# ---------- 插件 ----------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-floax'

# 自动保存 / 重启后自动恢复会话
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
# 恢复时重新启动 Claude Code，--continue 接上该目录最近的对话。分两种启动方式，其他参数不保留。
# 不要用 resurrect 的 * 语法：它会把 * 展开成当前目录的文件名
set -g @resurrect-processes '"~claude --dangerously-skip-permissions->claude --dangerously-skip-permissions --continue" "~^(/opt/homebrew/bin/)?claude( --continue)?\$->claude --continue"'
# 复制后停留在原滚动位置（按 q 退出复制模式）
set -g @yank_action 'copy-pipe'
# prefix + F：fzf 管理会话/窗口/面板；prefix + p：悬浮终端
set -g @floax-bind 'p'
set -g @floax-width '85%'
set -g @floax-height '80%'
set -g @floax-border-color '#F92672'
set -g @floax-text-color '#F8F8F2'
TMUX_FZF_LAUNCH_KEY="F"

run '~/.tmux/plugins/tpm/tpm'
