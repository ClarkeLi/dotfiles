<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="18">
  <title>Monokai terminal setup: tmux bar, prompt, and a Claude Code status line</title>
  <rect x="8" y="8" width="1184" height="404" rx="18" fill="#272822" stroke="#49483E" stroke-width="2"/>

  <!-- title bar -->
  <circle cx="40" cy="38" r="7" fill="#F92672"/>
  <circle cx="64" cy="38" r="7" fill="#E6DB74"/>
  <circle cx="88" cy="38" r="7" fill="#A6E22E"/>
  <text x="600" y="44" fill="#75715E" text-anchor="middle">ghostty — tmux</text>
  <line x1="8" y1="64" x2="1192" y2="64" stroke="#49483E" stroke-width="2"/>

  <!-- tmux status bar -->
  <rect x="32" y="82" width="96" height="30" rx="15" fill="#F92672"/>
  <text x="80" y="103" fill="#272822" font-weight="700" text-anchor="middle">claude</text>
  <rect x="144" y="82" width="130" height="30" rx="15" fill="#E6DB74"/>
  <text x="209" y="103" fill="#272822" font-weight="700" text-anchor="middle">1  nvim</text>
  <text x="296" y="103" fill="#A6A69C">2  zsh <tspan fill="#66D9EF">●</tspan></text>
  <text x="416" y="103" fill="#A6A69C">3  logs <tspan fill="#A6E22E">✓</tspan></text>
  <rect x="966" y="82" width="86" height="30" rx="15" fill="#66D9EF"/>
  <text x="1009" y="103" fill="#272822" font-weight="700" text-anchor="middle">11-25</text>
  <rect x="1062" y="82" width="106" height="30" rx="15" fill="#A6E22E"/>
  <text x="1115" y="103" fill="#272822" font-weight="700" text-anchor="middle">18:30</text>

  <!-- prompt -->
  <text x="34" y="162" fill="#75715E">╭─</text>
  <path d="M62 142h120l16 15-16 15H62z" fill="#F92672"/>
  <text x="76" y="163" fill="#272822" font-weight="700">macOS</text>
  <path d="M182 142h172l16 15-16 15H182l16-15z" fill="#FD971F"/>
  <text x="212" y="163" fill="#272822" font-weight="700">~/dotfiles</text>
  <path d="M354 142h132l16 15-16 15H354l16-15z" fill="#E6DB74"/>
  <text x="386" y="163" fill="#272822" font-weight="700">⎇ main</text>
  <text x="34" y="196" fill="#75715E">╰─<tspan fill="#A6E22E">❯</tspan> <tspan fill="#A6E22E">./install.sh</tspan> <tspan fill="#FD971F">--dry-run</tspan></text>

  <!-- big title -->
  <text x="600" y="272" fill="#F8F8F2" font-size="64" font-weight="700" text-anchor="middle">dot<tspan fill="#F92672">files</tspan></text>
  <text x="600" y="308" fill="#66D9EF" text-anchor="middle">Ghostty · tmux · Neovim · zsh · Claude Code</text>

  <!-- palette -->
  <g transform="translate(450 328)">
    <circle cx="0" cy="10" r="10" fill="#F92672"/>
    <circle cx="50" cy="10" r="10" fill="#FD971F"/>
    <circle cx="100" cy="10" r="10" fill="#E6DB74"/>
    <circle cx="150" cy="10" r="10" fill="#A6E22E"/>
    <circle cx="200" cy="10" r="10" fill="#66D9EF"/>
    <circle cx="250" cy="10" r="10" fill="#AE81FF"/>
    <circle cx="300" cy="10" r="10" fill="#75715E"/>
  </g>

  <!-- status line -->
  <line x1="8" y1="364" x2="1192" y2="364" stroke="#49483E" stroke-width="2"/>
  <text x="34" y="394" fill="#F92672" font-weight="700">◆ Claude <tspan fill="#66D9EF" font-weight="400">(medium)</tspan><tspan fill="#75715E"> ▏ </tspan><tspan fill="#AE81FF" font-weight="400">⎇ main</tspan><tspan fill="#75715E" font-weight="400"> ▏ ctx </tspan><tspan fill="#A6E22E">━━</tspan><tspan fill="#49483E">────</tspan><tspan fill="#A6E22E" font-weight="400"> 31%</tspan><tspan fill="#75715E" font-weight="400"> ▏ 5h </tspan><tspan fill="#A6E22E" font-weight="400">82%</tspan><tspan fill="#75715E" font-weight="400"> ▏ </tspan><tspan fill="#A6E22E" font-weight="400">● cache</tspan></text>
</svg>
